server {
    listen 80;
    server_name _;
    
    # Hide nginx version
    server_tokens off;
    
    # Security headers — VULN-3 fix: NO internal IPs, no unsafe-eval
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; media-src 'self' blob:; frame-ancestors 'none';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    
    # Static assets with cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers must be re-added in location blocks (nginx behavior)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for SSE/streaming
        proxy_buffering off;
    }
    
    # CV WebSocket — kiosk real-time recognition (VULN-1 fix: only stream/ws allowed)
    location /cv/ws/ {
        rewrite ^/cv/ws/(.*) /ws/$1?api_key=CV_API_KEY_PLACEHOLDER break;
        proxy_pass http://cv_service:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10;
        proxy_buffering off;
        proxy_cache off;
    }
    
    # CV Stream — MJPEG video feed for kiosk
    location /cv/stream/ {
        proxy_pass http://cv_service:8001/stream/;
        proxy_set_header X-API-Key "CV_API_KEY_PLACEHOLDER";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # VULN-1 fix: Block all other CV management endpoints from external access
    # /cv/health, /cv/openapi.json, /cv/cameras/*, /cv/reload, /cv/invalidate/*
    # These are only accessible internally (backend → CV service via localhost)
    location /cv/ {
        return 403;
    }
    
    # VULN-8 fix: Block API documentation endpoints
    location /docs { return 404; }
    location /openapi.json { return 404; }
    location /redoc { return 404; }
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
