version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: facegym
      POSTGRES_USER: facegym
      POSTGRES_PASSWORD: facegym_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://facegym:facegym_dev@db:5432/facegym
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-change-in-production
      JWT_SECRET: dev-jwt-secret-change-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db
      - redis

  cv-service:
    build: ./cv_service
    ports:
      - "8001:8001"
    environment:
      BACKEND_API_URL: http://backend:8000/api
      REDIS_URL: redis://redis:6379/0
      USE_GPU: "false"
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
